<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introgle Video Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; flex-direction: column; user-select: none; }
        .card { background: #1e1e1e; width: 100%; max-width: 850px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); padding: 20px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { background: #0066cc; color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 320px; margin-bottom: 15px; }
        .video-container { background: #000; border-radius: 8px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.75); padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .ai-status { position: absolute; top: 8px; left: 8px; background: rgba(0, 132, 255, 0.85); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; z-index: 5; }
        .setup-box { border: 1px solid #333; padding: 12px; border-radius: 8px; margin-bottom: 15px; background: #262626; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .row { display: flex; align-items: center; gap: 10px; }
        select, input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #444; border-radius: 6px; font-size: 14px; background: #333; color: white; }
        .chat-window { height: 140px; border: 1px solid #333; border-radius: 8px; overflow-y: auto; padding: 10px; background: #181818; margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
        .msg { padding: 6px 10px; border-radius: 6px; max-width: 85%; font-size: 13px; word-wrap: break-word; }
        .msg.you { background-color: #0084ff; color: white; align-self: flex-end; }
        .msg.stranger { background-color: #3a3b3c; color: #e4e6eb; align-self: flex-start; }
        .msg.system { background-color: #332701; color: #ffd966; align-self: center; text-align: center; font-size: 11px; width: 100%; border: 1px solid #664d03; }
        .controls { display: flex; gap: 8px; }
        .controls input { flex: 1; }
        button { background-color: #0084ff; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        .btn-next { background-color: #28a745; transition: background 0.3s; }
        .btn-report { background-color: #dc3545; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 20px; text-align: center; }
        .policy-modal { display: none; position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: #1e1e1e; padding: 20px; border-radius: 10px; z-index: 30; border: 1px solid #444; max-height: 80vh; overflow-y: auto; }
        .footer-links { margin-top: 15px; font-size: 12px; text-align: center; color: #888; }
        .footer-links a { color: #0084ff; text-decoration: none; margin: 0 10px; cursor: pointer; }
        .local-warning { display: none; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(220,53,69,0.95); color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h2>introgle Video</h2>
        <div class="badge">Meets Completed: <span id="meet-count">0</span></div>
    </div>
    <div class="video-grid" id="videoGrid">
        <div class="video-container" id="localVideoContainer">
            <div id="aiStatusLabel" class="ai-status">AI: Scanning...</div>
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="video-label">You</div>
            <div id="localWarning" class="local-warning"></div>
        </div>
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-label" id="remoteLabel">Stranger (Waiting)</div>
        </div>
    </div>
    <div class="setup-box">
        <div class="row">
            <label for="genderSelect"><strong>Gender:</strong></label>
            <select id="genderSelect">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <div class="row">
            <label id="captchaQuestion" style="font-size: 13px; color: #ffeb3b; font-weight:bold;">Bot Check: </label>
            <input type="number" id="captchaAnswer" style="width:60px;" placeholder="?">
        </div>
        <div class="row">
            <input type="checkbox" id="ageCheck">
            <label for="ageCheck" style="font-size: 12px;">I verify that I am 18+</label>
        </div>
        <div class="row">
            <input type="checkbox" id="policyCheck">
            <label for="policyCheck" style="font-size: 12px;">I accept the <a onclick="openPolicy('tos')" style="color:#0084ff;cursor:pointer;">Terms</a>, <a onclick="openPolicy('privacy')" style="color:#0084ff;cursor:pointer;">Privacy</a> & <a onclick="openPolicy('guidelines')" style="color:#0084ff;cursor:pointer;">Guidelines</a></label>
        </div>
    </div>
    <div class="chat-window" id="chatBox"></div>
    <div class="controls">
        <input type="text" id="msgInput" placeholder="Type a message..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        <button id="reportBtn" class="btn-report" onclick="reportUser()" disabled>Report & Block</button>
        <button id="autoMatchBtn" class="btn-next" onclick="toggleAutoMatch()">Start Auto-Match</button>
    </div>
    <div class="modal-overlay" id="adModal">
        <h3>Sponsored Advertisement</h3>
        <div class="ad-box" id="adContainer" style="background: #2a2a2a; width: 100%; height: 140px; margin: 15px 0; display: flex; align-items: center; justify-content: center;">[ Loading Ad... ]</div>
        <button id="skipAdBtn" onclick="closeAd()" disabled>Skip Ad (5s)</button>
    </div>
</div>
<div class="footer-links">
    <a onclick="openPolicy('tos')">Terms of Service</a> | 
    <a onclick="openPolicy('privacy')">Privacy Policy</a> | 
    <a onclick="openPolicy('guidelines')">Community Guidelines</a>
</div>
<div class="policy-modal" id="policyModal">
    <h3 id="policyTitle" style="margin-bottom: 10px;"></h3>
    <div id="policyText" style="font-size: 14px; text-align: left; margin-bottom: 15px; color: #ccc;"></div>
    <button onclick="closePolicy()">Close</button>
</div>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    let ws = null;
    let peerConnection = null;
    let localStream = null;
    let meetCount = 0;
    let captchaExpected = 0;
    let monitorWs = null;
    let globalMonitorInterval = null;
    let isAutoMatching = false;
    let hasBeenBanned = false;
    let genderMismatchCount = 0;

    document.addEventListener('contextmenu', event => event.preventDefault());

    function enforceSecurityTermination() {
        if (peerConnection || (ws && ws.readyState === WebSocket.OPEN)) {
            turnOffAutoMatch();
            closePeerConnection();
            alert("Call Terminated: Screenshots, screen recording, and backgrounding are strictly prohibited.");
        }
    }

    window.addEventListener('blur', enforceSecurityTermination);
    document.addEventListener('visibilitychange', () => { if (document.hidden) enforceSecurityTermination(); });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'PrintScreen' || (e.ctrlKey && ['p', 's', 'c'].includes(e.key.toLowerCase())) || (e.metaKey && e.shiftKey && ['3', '4', '5'].includes(e.key))) {
            e.preventDefault();
            navigator.clipboard.writeText(''); 
            enforceSecurityTermination();
        }
    });

    async function fetchAd() {
        try {
            const response = await fetch('/api/ad');
            const data = await response.json();
            document.getElementById('adContainer').innerHTML = data.ad_content;
        } catch (err) {}
    }
    fetchAd();

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function generateCaptcha() {
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        captchaExpected = num1 + num2;
        document.getElementById('captchaQuestion').textContent = `Bot Check: ${num1} + ${num2} = `;
        document.getElementById('captchaAnswer').value = '';
    }
    generateCaptcha();

    const policies = {
        tos: { title: "Terms of Service", text: "By using introgle, you agree to not use the platform for illegal activities." },
        privacy: { title: "Privacy Policy", text: "Video frames are processed in real-time for safety verification and immediately discarded." },
        guidelines: { title: "Community Guidelines", text: "1. No Nudity. 2. No minors. 3. No scams. AI monitors frames continuously." }
    };
    function openPolicy(type) {
        document.getElementById('policyTitle').textContent = policies[type].title;
        document.getElementById('policyText').textContent = policies[type].text;
        document.getElementById('policyModal').style.display = 'block';
    }
    function closePolicy() { document.getElementById('policyModal').style.display = 'none'; }

    async function initWebcam() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            startGlobalMonitor();
        } catch (err) {
            alert("Webcam & Microphone access are required.");
        }
    }
    initWebcam();

    function captureSnapshot(targetWidth = 320) {
        const video = document.getElementById('localVideo');
        const canvas = document.getElementById('canvas');
        const scale = video.videoWidth ? (targetWidth / video.videoWidth) : 1;
        canvas.width = targetWidth;
        canvas.height = video.videoHeight ? (video.videoHeight * scale) : (targetWidth * 0.75);
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.7);
    }

    function showToastWarning(msg) {
        const warningDiv = document.getElementById('localWarning');
        if (warningDiv) {
            warningDiv.textContent = msg;
            warningDiv.style.display = 'block';
            setTimeout(() => { warningDiv.style.display = 'none'; }, 3000);
        }
        if (document.getElementById('chatBox') && ws && ws.readyState === WebSocket.OPEN) {
            appendMessage(msg, "system");
        }
    }

    function handleGenderMismatch(payload) {
        genderMismatchCount++;
        showToastWarning(`${payload} (${genderMismatchCount}/5)`);
        
        if (genderMismatchCount >= 5) {
            turnOffAutoMatch();
            closePeerConnection();
            alert("Auto-Match stopped: Gender mismatch detected 5 times.");
            genderMismatchCount = 0; // Reset after stopping
        }
    }

    function startGlobalMonitor() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        monitorWs = new WebSocket(`${protocol}//${location.host}/ws/monitor`);

        monitorWs.onopen = () => {
            if (globalMonitorInterval) clearInterval(globalMonitorInterval);
            globalMonitorInterval = setInterval(() => {
                if (monitorWs.readyState === WebSocket.OPEN) {
                    monitorWs.send(JSON.stringify({ 
                        image: captureSnapshot(160),
                        gender: document.getElementById('genderSelect').value
                    }));
                }
            }, 2000);
        };

        monitorWs.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'error') {
                hasBeenBanned = true;
                turnOffAutoMatch();
                alert(data.payload);
                location.reload(); 
            } else if (data.type === 'warning') {
                showToastWarning(data.payload);
            } else if (data.type === 'gender_mismatch') {
                handleGenderMismatch(data.payload);
            } else if (data.type === 'ai_status') {
                const aiLabel = document.getElementById('aiStatusLabel');
                if (aiLabel) aiLabel.textContent = data.payload;
            }
        };

        monitorWs.onclose = () => {
            clearInterval(globalMonitorInterval);
            setTimeout(startGlobalMonitor, 5000); 
        };
    }

    function appendMessage(text, type) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function turnOffAutoMatch() {
        isAutoMatching = false;
        const btn = document.getElementById('autoMatchBtn');
        btn.textContent = "Start Auto-Match";
        btn.style.backgroundColor = "#28a745"; // Green
    }

    function toggleAutoMatch() {
        if (!document.getElementById('ageCheck').checked || !document.getElementById('policyCheck').checked) {
            alert("Policy and age verification checks are required."); return;
        }
        if (parseInt(document.getElementById('captchaAnswer').value) !== captchaExpected) {
            alert("Incorrect Bot Check answer."); generateCaptcha(); return;
        }
        if (hasBeenBanned) {
            alert("Your IP is banned."); return;
        }

        isAutoMatching = !isAutoMatching;
        const btn = document.getElementById('autoMatchBtn');
        
        if (isAutoMatching) {
            btn.textContent = "Stop Auto-Match";
            btn.style.backgroundColor = "#dc3545"; // Red
            findNextStranger();
        } else {
            turnOffAutoMatch();
            closePeerConnection();
        }
    }

    function findNextStranger() {
        if (!isAutoMatching || hasBeenBanned) return;
        closePeerConnection();
        meetCount++;
        document.getElementById('meet-count').textContent = meetCount;

        if (meetCount > 1 && meetCount % 5 === 0) {
            triggerAdModal();
        } else {
            startChatProcess();
        }
    }

    function startChatProcess() {
        const gender = document.getElementById('genderSelect').value;
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        appendMessage("Verifying AI safety protocols...", "system");

        const snapshot = captureSnapshot(320);
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/chat/${gender}`);

        ws.onopen = () => { 
            ws.send(JSON.stringify({ type: 'verify', image: snapshot, policy_accepted: true })); 
        };

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'status') {
                appendMessage(data.payload, "system");
            } else if (data.type === 'match_start') {
                appendMessage(`Matched with a ${data.partner_gender}! Connecting video...`, "system");
                document.getElementById('remoteLabel').textContent = `Stranger (${data.partner_gender})`;
                document.getElementById('msgInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('reportBtn').disabled = false;
                setupWebRTC(data.role === 'initiator');
            } else if (data.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'answer', answer }));
            } else if (data.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            } else if (data.type === 'candidate') {
                if (peerConnection && data.candidate) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } else if (data.type === 'message') {
                appendMessage(data.payload, "stranger");
            } else if (data.type === 'warning') {
                showToastWarning(data.payload);
            } else if (data.type === 'gender_mismatch') {
                handleGenderMismatch(data.payload);
            } else if (data.type === 'peer_disconnected') {
                appendMessage("Stranger has disconnected.", "system");
                if (isAutoMatching) {
                    appendMessage("Finding next stranger...", "system");
                    setTimeout(findNextStranger, 1500);
                } else {
                    closePeerConnection();
                }
            } else if (data.type === 'error' || data.type === 'system') {
                appendMessage(data.payload, "system");
                if (data.type === 'error') {
                    if (data.payload.includes("Banned")) {
                        hasBeenBanned = true;
                        turnOffAutoMatch();
                    }
                    closePeerConnection();
                }
            }
        };

        ws.onclose = () => {
            closePeerConnection();
        };
    }

    function setupWebRTC(isInitiator) {
        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => { document.getElementById('remoteVideo').srcObject = event.streams[0]; };
        peerConnection.onicecandidate = (event) => {
            if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
            }
        };

        if (isInitiator) {
            peerConnection.onnegotiationneeded = async () => {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'offer', offer }));
            };
        }
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const message = input.value.trim();
        if (message && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'text', payload: message }));
            appendMessage(message, "you");
            input.value = '';
        }
    }

    function reportUser() {
        if (ws && ws.readyState === WebSocket.OPEN && confirm("Are you sure you want to report this user? This will ban them.")) {
            ws.send(JSON.stringify({ type: 'report' }));
        }
    }

    document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function closePeerConnection() {
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        if (ws) { ws.close(); ws = null; }
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('remoteLabel').textContent = "Stranger (Disconnected)";
        document.getElementById('msgInput').disabled = true;
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('reportBtn').disabled = true;
    }

    function triggerAdModal() {
        const modal = document.getElementById('adModal');
        const skipBtn = document.getElementById('skipAdBtn');
        modal.style.display = 'flex';
        let adCountdown = 5;
        skipBtn.disabled = true;
        fetchAd(); 

        const adTimer = setInterval(() => {
            adCountdown--;
            if (adCountdown > 0) { skipBtn.textContent = `Skip Ad (${adCountdown}s)`; } 
            else {
                clearInterval(adTimer);
                skipBtn.textContent = "Continue to Next Chat";
                skipBtn.disabled = false;
            }
        }, 1000);
    }

    function closeAd() {
        document.getElementById('adModal').style.display = 'none';
        if (isAutoMatching) {
            startChatProcess();
        }
    }
</script>
</body>
</html>
